<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Carro robotico con Arduino">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf3ff"/>
      <stop offset="100%" stop-color="#d7e7fb"/>
    </linearGradient>
    <linearGradient id="chasis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6fb4"/>
      <stop offset="100%" stop-color="#123357"/>
    </linearGradient>
    <linearGradient id="tapa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fd4ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6ec6ff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="520" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="96" cy="82" r="46" fill="#6ec6ff" opacity="0.25"/>
  <circle cx="440" cy="330" r="60" fill="#2564a8" opacity="0.12"/>

  <!-- sombra -->
  <ellipse cx="260" cy="318" rx="168" ry="20" fill="#0b1f33" opacity="0.14"/>

  <!-- ruedas traseras -->
  <g fill="#0b1f33">
    <rect x="96" y="212" width="44" height="78" rx="16"/>
    <rect x="380" y="212" width="44" height="78" rx="16"/>
  </g>
  <g fill="#3e556c">
    <rect x="104" y="228" width="28" height="46" rx="12"/>
    <rect x="388" y="228" width="28" height="46" rx="12"/>
  </g>

  <!-- chasis -->
  <rect x="122" y="204" width="276" height="72" rx="20" fill="url(#chasis)"/>
  <rect x="140" y="222" width="240" height="10" rx="5" fill="#6ec6ff" opacity="0.45"/>

  <!-- placa arduino -->
  <rect x="176" y="150" width="120" height="60" rx="10" fill="#1a4a78"/>
  <rect x="186" y="160" width="38" height="24" rx="4" fill="#6ec6ff" opacity="0.8"/>
  <g fill="#d7e7fb">
    <rect x="186" y="192" width="100" height="6" rx="3"/>
    <rect x="232" y="160" width="8" height="8" rx="2"/>
    <rect x="248" y="160" width="8" height="8" rx="2"/>
    <rect x="264" y="160" width="8" height="8" rx="2"/>
    <rect x="232" y="174" width="8" height="8" rx="2"/>
    <rect x="248" y="174" width="8" height="8" rx="2"/>
    <rect x="264" y="174" width="8" height="8" rx="2"/>
  </g>

  <!-- modulo L298N -->
  <rect x="306" y="166" width="76" height="44" rx="9" fill="#123357"/>
  <rect x="316" y="176" width="24" height="24" rx="5" fill="#3e556c"/>
  <g fill="#6ec6ff">
    <rect x="348" y="178" width="26" height="5" rx="2.5"/>
    <rect x="348" y="190" width="26" height="5" rx="2.5"/>
  </g>

  <!-- tapa acrilica -->
  <path d="M168 146 L200 108 H332 L360 146 Z" fill="url(#tapa)" stroke="#2564a8" stroke-opacity="0.35" stroke-width="2"/>

  <!-- cables -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M296 186 C 306 186, 300 200, 312 200" stroke="#e05c5c"/>
    <path d="M296 196 C 308 196, 302 210, 314 210" stroke="#f2b544"/>
  </g>

  <!-- senal bluetooth -->
  <g stroke="#2564a8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M398 118 a26 26 0 0 1 0 34"/>
    <path d="M412 104 a44 44 0 0 1 0 62"/>
  </g>
  <circle cx="386" cy="135" r="7" fill="#2564a8"/>

  <!-- destornillador -->
  <g transform="rotate(-28 120 340)">
    <rect x="86" y="332" width="52" height="16" rx="8" fill="#1a4a78"/>
    <rect x="138" y="337" width="46" height="6" rx="3" fill="#7f96ad"/>
    <rect x="184" y="335" width="10" height="10" rx="2" fill="#3e556c"/>
  </g>
</svg>
